name: Frontend Build

# Verifies that `frontend/` compiles cleanly. Required status check on `main`
# and `qubits` so no PR can land code that breaks the production build.
#
# Run deterministic React/unit regressions before compiling. Browser/e2e
# coverage remains separate from this fast PR gate.

on:
  # This workflow is a required status check on protected branches. It must run
  # for every PR, not only PRs that touch frontend paths; otherwise docs/CI-only
  # PRs would be blocked forever waiting for a check that never reports.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [qubits, main]
  workflow_dispatch:

# PR and push runs are separate: a PR from qubits cannot cancel its release CI.
concurrency:
  group: frontend-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify deployable package boundaries
        working-directory: frontend
        run: npm run test:deployment-contract

      - name: Run frontend behavioral regressions
        working-directory: frontend
        run: npm run test:unit

      # `next build` does TypeScript type-checking and webpack compilation, so
      # this single step catches both type errors and missing dependencies.
      - name: Build (next build)
        working-directory: frontend
        run: npm run build
        env:
          # Provide harmless placeholder values for required env so the build
          # doesn't fail at config load. The build does not connect to these.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-only
          NEXT_PUBLIC_API_URL: http://localhost:9090
