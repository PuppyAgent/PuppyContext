name: Native inventory migration (local Docker)
on:
  push:
    branches: [qubits, main]
    paths:
      - 'supabase/**'
      - 'backend/src/**'
      - 'backend/tests/repository_hosting/**'
      - 'scripts/testing/**'
      - '.github/workflows/native-inventory-migration-tests.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'backend/src/**'
      - 'backend/tests/repository_hosting/**'
      - 'scripts/testing/**'
      - '.github/workflows/native-inventory-migration-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: '2.107.0'
      - name: Install locked tooling
        run: |
          python -m pip install 'uv==0.5.11'
          cd backend
          uv sync --locked
      - name: Exercise real migration against disposable Docker DB and S3
        run: backend/.venv/bin/python scripts/testing/run_native_inventory_migration.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-inventory-migration-results
          path: backend/.native-migration-test-results/
          include-hidden-files: true
          retention-days: 14
