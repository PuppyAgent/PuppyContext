name: Reusable Schema Deployment

on:
  workflow_call:
    inputs:
      environment:
        description: Protected GitHub environment name
        required: true
        type: string
      allow_data_migration_pause:
        description: Treat an explicit DATA_MIGRATION_REQUIRED guard as a controlled pause
        required: false
        default: false
        type: boolean
    outputs:
      schema_state:
        description: deployed or data_migration_required
        value: ${{ jobs.deploy_schema.outputs.schema_state }}
      required_data_migration_id:
        description: Data migration requested by the blocked contract migration
        value: ${{ jobs.deploy_schema.outputs.required_data_migration_id }}

permissions:
  contents: read

jobs:
  deploy_schema:
    name: Deploy schema to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      schema_state: ${{ steps.push.outputs.schema_state }}
      required_data_migration_id: ${{ steps.push.outputs.required_data_migration_id }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: database-${{ inputs.environment }}
      cancel-in-progress: false
      queue: max
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALLOW_DATA_MIGRATION_PAUSE: ${{ inputs.allow_data_migration_pause }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: "2.107.0"

      - name: Use Supabase's Docker Hub mirror
        # setup-cli defaults to GHCR, whose shared anonymous pull limit can
        # block the shadow database. Keep the CLI's pinned image versions.
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io" >> "$GITHUB_ENV"

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Validate required deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?supabase_access_token is required}"
          : "${SUPABASE_PROJECT_ID:?supabase_project_id is required}"

      - name: Bind protected PostgreSQL connection
        run: python3 supabase/releases/connection.py

      - name: Verify and adopt archived baseline history
        run: python3 scripts/database_history.py adopt

      - name: Show pending schema plan
        run: supabase db push --db-url "$SUPABASE_DATABASE_URL" --dry-run

      - name: Check legacy credential readiness before any schema write
        run: >-
          psql -X -v ON_ERROR_STOP=1 -c "SET SESSION ROLE postgres;"
          -f supabase/releases/legacy_credential_preflight.sql

      - name: Apply pending schema migrations
        id: push
        shell: bash
        run: |
          set -uo pipefail
          set +e
          supabase db push --db-url "$SUPABASE_DATABASE_URL" --yes 2>&1 | tee /tmp/schema-push.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            if grep -q "DATA_MIGRATION_REQUIRED:" /tmp/schema-push.log; then
              migration_id=$(grep -oE 'DATA_MIGRATION_REQUIRED:[0-9A-Za-z_]+' /tmp/schema-push.log | head -n1 | cut -d: -f2)
              echo "schema_state=data_migration_required" >> "$GITHUB_OUTPUT"
              echo "required_data_migration_id=$migration_id" >> "$GITHUB_OUTPUT"
              {
                echo "## Schema deployment paused safely"
                echo
                echo "Contract migration requires data migration: \`$migration_id\`."
                echo "Run and verify the protected data migration, then retry schema deployment."
              } >> "$GITHUB_STEP_SUMMARY"
              if [ "$ALLOW_DATA_MIGRATION_PAUSE" = "true" ]; then
                exit 0
              fi
            fi
            exit "$status"
          fi
          echo "schema_state=deployed" >> "$GITHUB_OUTPUT"
          echo "required_data_migration_id=" >> "$GITHUB_OUTPUT"

      - name: Run database smoke contracts
        if: steps.push.outputs.schema_state == 'deployed'
        run: >-
          psql -X -v ON_ERROR_STOP=1 -c "SET SESSION ROLE postgres;"
          -f supabase/tests/_support/schema_contracts.inc

      - name: Refresh expiring connection before drift check
        if: steps.push.outputs.schema_state == 'deployed'
        run: python3 supabase/releases/connection.py

      - name: Fail on post-deploy schema drift
        if: steps.push.outputs.schema_state == 'deployed'
        shell: bash
        run: |
          set -euo pipefail
          # PuppyOne owns public. A protected database may also host schemas
          # owned by another service (for example PuppyPay's `puppypay`), which
          # must not be adopted into or deleted by PuppyOne migrations.
          if ! diff_output=$(supabase db diff --db-url "$SUPABASE_DATABASE_URL" --schema public 2>&1); then
            echo "::error::Could not evaluate post-deploy schema drift."
            echo "$diff_output"
            exit 1
          fi
          if [ -n "$diff_output" ] && ! grep -q "No schema changes found" <<< "$diff_output"; then
            echo "::error::$TARGET_ENVIRONMENT database has schema drift"
            echo "$diff_output"
            exit 1
          fi

      - name: Publish schema attestation
        if: steps.push.outputs.schema_state == 'deployed'
        shell: bash
        run: |
          set -euo pipefail
          bundle_checksum=$(git ls-files 'supabase/migrations/*.sql' | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          {
            echo "## Database schema attestation"
            echo
            echo "- Environment: $TARGET_ENVIRONMENT"
            echo "- Source SHA: $GITHUB_SHA"
            echo "- Migration bundle SHA-256: $bundle_checksum"
            echo
            echo '```text'
            supabase migration list --db-url "$SUPABASE_DATABASE_URL"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
