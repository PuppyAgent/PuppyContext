name: Release Upgrade Rehearsal

on:
  pull_request:
    branches: [qubits, main]
  push:
    branches: [qubits, main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: release-rehearsal-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rehearse:
    name: Populated upgrade (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the last accepted target version
        id: baseline
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          BASELINE_ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const environment = process.env.BASELINE_ENVIRONMENT;
            if (!['staging', 'production'].includes(environment)) throw new Error('Unsupported release target');
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo, environment, task: 'puppyone-release', per_page: 100
            });
            for (const deployment of deployments) {
              const statuses = await github.paginate(github.rest.repos.listDeploymentStatuses, {
                ...context.repo, deployment_id: deployment.id, per_page: 100
              });
              if (statuses.some(s => s.state === 'success')) {
                core.setOutput('sha', deployment.sha);
                return;
              }
            }
            // One-time adoption of the actual versions inspected before the
            // coordinator existed. Subsequent runs resolve accepted deployments.
            const manifest = JSON.parse(require('fs').readFileSync('supabase/releases/deployed-bases.json'));
            const sha = manifest.bootstrap[environment];
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Missing verified bootstrap version');
            core.setOutput('sha', sha);
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: '2.107.0'
      - name: Install locked rehearsal dependencies
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --silent --retry 3 --connect-timeout 10 --max-time 60 \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y -qq postgresql-17 postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          python -m pip install 'uv==0.5.11'
          cd backend
          uv sync --locked
          cd ../e2e
          npm ci
          npx playwright install --with-deps chromium
      - name: Rehearse the complete populated upgrade and acceptance
        env:
          UPGRADE_BASE: ${{ steps.baseline.outputs.sha }}
          PYTHONPATH: backend
        run: |
          backend/.venv/bin/python scripts/test_self_hosted_install.py \
            --variant release --upgrade-base "$UPGRADE_BASE" \
            --artifacts "$RUNNER_TEMP/release-rehearsal"
      - name: Verify database serialization and interruption recovery
        env:
          PUPPYONE_RELEASE_PG_TEST: '1'
          PYTHONPATH: backend
        run: backend/.venv/bin/python -m pytest backend/tests/infra/data_migrations/test_release_postgres.py -q
      - name: Retain sanitized rehearsal result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-rehearsal-${{ matrix.environment }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-rehearsal/result.json
            ${{ runner.temp }}/release-rehearsal/release.json
            ${{ runner.temp }}/release-rehearsal/diagnostics.json
          if-no-files-found: warn
          retention-days: 14

  result:
    name: Release upgrade rehearsal
    if: always()
    needs: rehearse
    runs-on: ubuntu-latest
    steps:
      - name: Require both deployed baselines to upgrade
        env:
          REHEARSAL_RESULT: ${{ needs.rehearse.result }}
        run: test "$REHEARSAL_RESULT" = success
