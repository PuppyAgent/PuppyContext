name: Reusable Operator Data Verification

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      migration_id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    # Keep this name stable: Main Release Gate searches it as the attestation
    # for an operator-local migration.
    name: verify ${{ inputs.migration_id }} on ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    concurrency:
      group: database-${{ inputs.environment }}
      cancel-in-progress: false
      queue: max
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MIGRATION_ID: ${{ inputs.migration_id }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate immutable verification artifact
        shell: bash
        run: python3 scripts/database_history.py data-path "$MIGRATION_ID"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install locked backend environment
        working-directory: backend
        run: |
          python -m pip install "uv==0.5.11"
          uv sync --locked

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Bind protected PostgreSQL connection
        run: python3 supabase/releases/connection.py

      - name: Verify Supabase completion state
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          uv run puppyone-db verify-external-state "$MIGRATION_ID" > "$RUNNER_TEMP/data-verification.json"

      - name: Publish operator verification attestation
        shell: bash
        run: |
          {
            echo "## Operator-local data migration verification"
            echo
            echo "- Environment: $TARGET_ENVIRONMENT"
            echo "- Migration: $MIGRATION_ID"
            echo "- Source SHA: $GITHUB_SHA"
            echo "- External data-plane work: not executed by CI"
            echo '```json'
            cat "$RUNNER_TEMP/data-verification.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
