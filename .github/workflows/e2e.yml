name: E2E Visual Tests

on:
  # Full-stack e2e is intentionally manual. It depends on live Supabase
  # secrets, a pre-baked E2E auth session, browser installation, backend boot,
  # frontend build/start, and external service availability, so it is too
  # fragile/noisy as an automatic PR signal. Keep it available for release
  # verification or focused debugging without blocking normal PRs.
  workflow_dispatch:

env:
  APP_URL: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:9090

permissions:
  contents: read

jobs:
  e2e:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qubits'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # --- Backend ---
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install "uv==0.5.11"

      - name: Install backend deps
        working-directory: backend
        run: uv sync --locked

      - name: Start backend
        working-directory: backend
        run: |
          uv run uvicorn src.main:app --host 0.0.0.0 --port 9090 &
          sleep 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # --- Frontend ---
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Start frontend
        working-directory: frontend
        run: |
          npm start &
          sleep 5

      # --- E2E ---
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium

      - name: Create auth session
        working-directory: e2e
        env:
          E2E_SESSION_JSON: ${{ secrets.E2E_SESSION_JSON }}
        run: |
          umask 077
          mkdir -p auth
          python -c 'import json, os; from pathlib import Path; value = os.environ["E2E_SESSION_JSON"]; json.loads(value); Path("auth/session.json").write_text(value)'

      - name: Run E2E scenarios
        working-directory: e2e
        run: node run.mjs

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-results-${{ github.sha }}
          path: e2e/results/
          retention-days: 30
