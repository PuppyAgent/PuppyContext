name: Validate Database Changes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  railway_release_contract:
    name: Validate Railway release contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate Qubits service inventory and database gate
        run: python backend/scripts/check_railway_release_gate.py

  database_change_scope:
    name: Detect database changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Detect database release paths
        id: detect
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_REF" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "$BASE_REF" --depth=1
          set +e
          git diff --quiet "origin/$BASE_REF...HEAD" -- \
            'supabase/migrations/**' \
            'supabase/archive/**' \
            'supabase/baselines/**' \
            'scripts/database_history.py' \
            'scripts/database_baseline.py' \
            'scripts/test_entrypoint_migration*.py' \
            'supabase/data_migrations/**' \
            'supabase/releases/**' \
            'supabase/tests/**' \
            'supabase/test_fixtures/**' \
            'backend/src/infra/data_migrations/**' \
            'backend/tests/infra/data_migrations/**' \
            'backend/tests/security/test_credential_backfill_ci_contract.py' \
            'backend/tests/security/test_unified_authorization_architecture.py' \
            'backend/tests/security/test_billing_database_boundary.py' \
            'backend/src/platform/billing/**' \
            'backend/src/platform/entitlements/**' \
            'backend/src/platform/managed_ai/**' \
            'backend/pyproject.toml' \
            'backend/uv.lock' \
            '.github/workflows/*migration*.yml' \
            '.github/workflows/migrate-*.yml' \
            '.github/workflows/_schema-deploy.yml' \
            '.github/workflows/_operator-data-verify.yml' \
            '.github/workflows/prepare-baseline.yml' \
            '.github/workflows/validate-migrations.yml' \
            '.github/workflows/main-release-gate.yml'
          status=$?
          set -e
          case "$status" in
            0) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

  repository_policy:
    name: Validate immutable migration artifacts
    needs: database_change_scope
    if: needs.database_change_scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install locked backend environment
        working-directory: backend
        run: |
          python -m pip install "uv==0.5.11"
          uv sync --locked

      - name: Validate manifests and repository database policy
        working-directory: backend
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          uv run puppyone-db lint
          if [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF" --depth=1
            uv run puppyone-db policy --base-ref "origin/$BASE_REF"
          fi

      - name: Run data migration and workflow regression tests
        working-directory: backend
        run: |
          uv run pytest \
            tests/infra/data_migrations \
            tests/security/test_credential_backfill_ci_contract.py \
            tests/security/test_unified_authorization_architecture.py \
            tests/security/test_billing_database_boundary.py \
            tests/infra/test_self_hosted_bootstrap.py \
            tests/infra/test_readiness.py \
            -q

  validate_local_database:
    name: Verify fresh install and existing-data upgrade
    needs: database_change_scope
    if: needs.database_change_scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: "2.107.0"

      - name: Use Supabase's Docker Hub mirror
        # Match the protected schema deploy without GHCR's shared pull limit.
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io" >> "$GITHUB_ENV"

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Install locked backend environment
        working-directory: backend
        run: |
          python -m pip install "uv==0.5.11"
          uv sync --locked

      - name: Start ephemeral Supabase
        run: supabase start

      - name: Verify fresh install contract path
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          supabase db reset --no-seed
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/_support/standalone_database.inc
          supabase test db

      - name: Upgrade populated standalone database without PuppyPay
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          # This is the local ephemeral Supabase started above, never --linked.
          # Keep this baseline fixed so future migrations exercise a real upgrade.
          python3 scripts/database_history.py stage --output "$RUNNER_TEMP/pre-b1"
          supabase db reset --local --no-seed --version 20260720000000 --workdir "$RUNNER_TEMP/pre-b1"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/test_fixtures/standalone_upgrade.sql
          supabase migration up --local --workdir "$RUNNER_TEMP/pre-b1"
          python3 scripts/database_history.py adopt
          supabase migration up --local
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/_support/standalone_database.inc
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/test_fixtures/standalone_upgrade_assert.sql
          supabase test db

      - name: Verify historical Project creator repair, retry, and receipt
        env:
          DATA_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          supabase db reset --no-seed
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f supabase/test_fixtures/project_creator_admin_repair.sql
          cd backend
          uv run puppyone-db run 20260713_reconcile_project_creator_admin
          uv run puppyone-db run 20260713_reconcile_project_creator_admin
          cd ..
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f supabase/archive/before_b1/data_migrations/20260713_reconcile_project_creator_admin/test_assert.sql

      - name: Verify legacy credential upgrade and pre-write admission
        working-directory: backend
        env:
          TEST_LEGACY_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: uv run pytest tests/infra/data_migrations/test_legacy_credentials_postgres.py -q

      - name: Verify repository-target upgrade, concurrency, and dirty-data blocking
        env:
          DATA_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: scripts/test-repository-target-migration.sh

      - name: Verify entrypoint storage migration and future cleanup
        run: backend/.venv/bin/python scripts/test_entrypoint_migration.py

      - name: Stop ephemeral Supabase
        if: always()
        run: supabase stop --no-backup

  lint_rpc_signatures:
    name: Lint RPC parameter types
    needs: database_change_scope
    if: needs.database_change_scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Enforce p_project_id TEXT in new migrations
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_REF" ]; then
            BASE_REF=main
          fi
          git fetch origin "$BASE_REF" --depth=1
          new_migrations=$(git diff --diff-filter=A --name-only \
            "origin/$BASE_REF...HEAD" -- 'supabase/migrations/*.sql' || true)
          if [ -z "$new_migrations" ]; then
            exit 0
          fi
          violations=""
          for file in $new_migrations; do
            [ -f "$file" ] || continue
            match=$(grep -niE \
              'p_project_id[[:space:]]+(UUID|INT|BIGINT|BIGSERIAL|SERIAL|VARCHAR|CHAR)\b' \
              "$file" || true)
            if [ -n "$match" ]; then
              violations="${violations}${file}:${match}"$'\n'
            fi
          done
          if [ -n "$violations" ]; then
            echo "::error::New migrations must declare p_project_id as TEXT."
            echo "$violations"
            exit 1
          fi

  database_validation_result:
    name: Database validation result
    if: always()
    needs:
      - railway_release_contract
      - database_change_scope
      - repository_policy
      - validate_local_database
      - lint_rpc_signatures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGE_SCOPE_RESULT: ${{ needs.database_change_scope.result }}
      DATABASE_CHANGED: ${{ needs.database_change_scope.outputs.changed }}
      POLICY_RESULT: ${{ needs.repository_policy.result }}
      LOCAL_DATABASE_RESULT: ${{ needs.validate_local_database.result }}
      RPC_LINT_RESULT: ${{ needs.lint_rpc_signatures.result }}
      RAILWAY_RELEASE_RESULT: ${{ needs.railway_release_contract.result }}
    steps:
      - name: Publish one stable required-check result
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CHANGE_SCOPE_RESULT" != "success" ]; then
            echo "::error::Database change detection failed."
            exit 1
          fi
          if [ "$RAILWAY_RELEASE_RESULT" != "success" ]; then
            echo "::error::Railway release contract validation failed."
            exit 1
          fi
          if [ "$DATABASE_CHANGED" != "true" ]; then
            echo "No database release paths changed."
            exit 0
          fi
          for result in "$POLICY_RESULT" "$LOCAL_DATABASE_RESULT" "$RPC_LINT_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required database validation job did not succeed."
              exit 1
            fi
          done
          echo "All database release validations succeeded."
