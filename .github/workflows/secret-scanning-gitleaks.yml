name: Secret scanning (Gitleaks)

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1' # Weekly, every Monday 03:00 UTC
  workflow_dispatch:

# Prevent duplicate runs across push and PR for the same ref
concurrency:
  group: gitleaks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Run Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # full history for scheduled scans

      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.18.3"
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "1a1d875769ff0fedd6fb3a21eb5f9b933ff7a6b68b56e5d564236e31189391ad  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          range=()
          if [ "$EVENT_NAME" = pull_request ]; then
            [[ "$PR_BASE" =~ ^[a-f0-9]{40}$ && "$PR_HEAD" =~ ^[a-f0-9]{40}$ ]]
            range=(--log-opts="$PR_BASE..$PR_HEAD")
          elif [ "$EVENT_NAME" = push ] && [[ "$PUSH_BASE" =~ ^[a-f0-9]{40}$ ]] && [[ "$PUSH_BASE" != 0000000000000000000000000000000000000000 ]]; then
            range=(--log-opts="$PUSH_BASE..$GITHUB_SHA")
          fi
          # PR/push: every incoming commit. Scheduled/manual: complete history.
          # Findings fail the job; reports always redact the matched values.
          gitleaks detect --source . "${range[@]}" \
            --report-format sarif --report-path gitleaks.sarif \
            --redact --no-banner --exit-code 1

      - name: Upload Gitleaks SARIF as artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7
