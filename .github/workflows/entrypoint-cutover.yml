name: Qubits Entrypoint Cutover

on:
  push:
    branches: [qubits]
    paths:
      - .github/workflows/entrypoint-cutover.yml
      - scripts/qubits_entrypoint_cutover.py
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only inspection; cutover is owned by the environment release
        required: true
        default: inspect
        type: choice
        options: [inspect]

permissions:
  contents: read

concurrency:
  group: database-release-staging
  cancel-in-progress: false
  queue: max

jobs:
  cutover:
    if: github.repository == 'puppyone-ai/puppyone-cloud' && github.ref == 'refs/heads/qubits'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      TARGET_ENVIRONMENT: staging
      CUTOVER_OPERATION: ${{ inputs.operation || 'inspect' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked backend environment
        working-directory: backend
        run: |
          python -m pip install 'uv==0.5.11'
          uv sync --locked
      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Bind protected Supabase target
        run: python3 supabase/releases/connection.py
      - name: Inspect cutover and recovery metadata
        if: env.CUTOVER_OPERATION == 'inspect'
        run: backend/.venv/bin/python scripts/qubits_entrypoint_cutover.py
      - name: Record reviewed cutover preparation
        if: github.event_name == 'workflow_dispatch' && env.CUTOVER_OPERATION == 'prepare'
        run: |
          echo '::error::Use the environment release coordinator for cutover'
          exit 1
