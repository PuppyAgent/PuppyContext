name: Deploy Database to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: database-release-production
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: github.repository == 'puppyone-ai/puppyone-cloud' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_environment-release.yml
    with:
      environment: production
