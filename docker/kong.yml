_format_version: "2.1"
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: __ANON_KEY__
  - username: service_role
    keyauth_credentials:
      - key: __SERVICE_ROLE_KEY__

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - apikey
        - x-client-info
        - x-supabase-api-version
      exposed_headers:
        - Content-Range
        - X-Total-Count
      credentials: true
      max_age: 3600
services:
  # Confirmation links and OAuth redirects arrive from a browser without an
  # apikey header. GoTrue verifies their token/state; the gateway must let them
  # reach the provider. Other Auth and REST endpoints retain key-auth.
  - name: auth-v1-verify
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-verify
        strip_path: true
        paths: ["/auth/v1/verify"]
  - name: auth-v1-callback
    url: http://auth:9999/callback
    routes:
      - name: auth-v1-callback
        strip_path: true
        paths: ["/auth/v1/callback"]
  - name: auth-v1-authorize
    url: http://auth:9999/authorize
    routes:
      - name: auth-v1-authorize
        strip_path: true
        paths: ["/auth/v1/authorize"]
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: key-auth
        config:
          key_names: [apikey]
          hide_credentials: false

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: key-auth
        config:
          key_names: [apikey]
          hide_credentials: false
