api_version: 1
id: 20261007_native_repository_inventory
description: Migrate frozen legacy project DB and S3 facts to checked native repositories
kind: python
entrypoint: run.py
verify: verify.sql
requires_schema:
  - "20261007010000"
required_env:
  - DATA_MIGRATION_DATABASE_URL
  - S3_ENDPOINT_URL
  - S3_ACCESS_KEY_ID
  - S3_SECRET_ACCESS_KEY
  - S3_REGION
  - S3_BUCKET_NAME
  - NATIVE_MIGRATION_WRITERS_DRAINED
timeout_seconds: 86400
batch_size: 200
legacy: false
